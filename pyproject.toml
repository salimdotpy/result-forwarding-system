[project]
name = "result-forwarding-system"
version = "0.1.0"
description = "Online Students' Result Forwarding Management System"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "jinja2>=3.1,<4.0",
  "sqlmodel>=0.0.24,<1.0",
  "pymysql>=1.1,<2.0",
  "alembic>=1.15,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "itsdangerous>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.11,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
